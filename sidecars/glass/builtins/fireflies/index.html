<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fireflies</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1213}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d', { alpha: false });
let w = 0, h = 0, t = 0, mx = 0.5, my = 0.5, speed = 1, density = 1, bgGrad = null, last = 0, raf = 0;
const bugs = Array.from({ length: 90 }, (_, i) => ({
  x: Math.random(), y: 0.15 + Math.random() * 0.8, r: 2 + Math.random() * 4.5,
  sx: 0.3 + Math.random() * 0.9, sy: 0.3 + Math.random() * 0.8, p: Math.random() * 6.28, si: i % 3,
}));
function makeSprite(hue) {
  const o = document.createElement('canvas'); o.width = o.height = 64;
  const g = o.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `hsla(${hue},100%,86%,1)`);
  gr.addColorStop(0.35, `hsla(${hue},95%,62%,0.48)`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return o;
}
const bugSprites = [makeSprite(34), makeSprite(44), makeSprite(52)];
const ambientSprite = (() => {
  const o = document.createElement('canvas'); o.width = o.height = 128;
  const g = o.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(245,158,11,0.22)'); gr.addColorStop(0.55, 'rgba(180,83,9,0.08)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return o;
})();
function resize() {
  const dpr = Math.min(1.25, devicePixelRatio || 1);
  w = c.width = Math.max(1, Math.round(innerWidth * dpr));
  h = c.height = Math.max(1, Math.round(innerHeight * dpr));
  bgGrad = ctx.createLinearGradient(0, 0, w * 0.4, h);
  bgGrad.addColorStop(0, '#2a1816'); bgGrad.addColorStop(0.45, '#472821'); bgGrad.addColorStop(1, '#181014');
}
addEventListener('resize', resize); resize();
addEventListener('mousemove', e => { mx = e.clientX / Math.max(1, innerWidth); my = e.clientY / Math.max(1, innerHeight); }, { passive: true });
window.wallpaperPropertyListener = { applyUserProperties(p) { if (p.speed) speed = Number(p.speed.value) || 1; if (p.density) density = Number(p.density.value) || 1; } };
function frame(now) {
  if (document.hidden) { raf = 0; return; }
  raf = requestAnimationFrame(frame);
  if (last && now - last < 31) return;
  const dt = last ? Math.min(0.06, (now - last) / 1000) : 0.033;
  last = now;
  t += 0.011 * (dt * 60) * speed;
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, w, h);
  const ar = Math.min(w, h) * 0.65;
  ctx.drawImage(ambientSprite, w * (0.5 + (mx - 0.5) * 0.1) - ar, h * (0.45 + (my - 0.5) * 0.08) - ar, ar * 2, ar * 2);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const count = Math.min(bugs.length, Math.round(52 * density));
  for (let i = 0; i < count; i++) {
    const b = bugs[i];
    const x = ((b.x + Math.sin(t * b.sx + b.p) * 0.045) * w + (mx - 0.5) * 28 + w) % w;
    const y = ((b.y + Math.cos(t * b.sy + b.p * 1.3) * 0.04) * h + (my - 0.5) * 22 + h) % h;
    ctx.globalAlpha = 0.22 + 0.78 * (0.5 + 0.5 * Math.sin(t * 2.4 + b.p));
    const rad = b.r * 5.5;
    ctx.drawImage(bugSprites[b.si], x - rad, y - rad, rad * 2, rad * 2);
  }
  ctx.restore();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(frame); } });
raf = requestAnimationFrame(frame);
</script>
</body>
</html>
